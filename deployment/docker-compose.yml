services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: helloceylon_frontend
    depends_on:
      - backend
    restart: always
    networks:
      - app-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: helloceylon_backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URL=mongodb://mongodb:27017/chatbot
      - CHATBOT_URL=http://chatbot:8000/chat
    depends_on:
      - mongodb
      - chatbot
    restart: always
    networks:
      - app-network

  chatbot:
    build:
      context: ../python-service
      dockerfile: Dockerfile
    container_name: helloceylon_chatbot
    ports:
      - "8000:8000"
    env_file:
      - ../python-service/.env
    restart: always
    networks:
      - app-network

  nginx:
    build: ../nginx
    container_name: helloceylon_nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

  mongodb:
    image: mongo:7
    container_name: chatbot_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always
    networks:
      - app-network

volumes:
  mongo_data:

networks:
  app-network:
    driver: bridge
